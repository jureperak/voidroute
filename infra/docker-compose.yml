services:
  caddy:
    # caddy:2 + Porkbun DNS plugin (see caddy/Dockerfile)
    build: ./caddy
    image: voidroute-caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${SERVER_BASE_PATH}/caddy/data:/data
      - ${SERVER_BASE_PATH}/caddy/config:/config
    environment:
      - SERVER_NAME=${SERVER_NAME}
      - VOIDROUTE_VPN_SUBNET=${VOIDROUTE_VPN_SUBNET}
    # PORKBUN_API_KEY / PORKBUN_API_SECRET_KEY, written by the deploy workflow (mode 600)
    env_file:
      - ${SERVER_BASE_PATH}/caddy/caddy.env
    networks:
      voidroute:
      homepage-mgmt:
        ipv4_address: 172.30.254.2

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ${SERVER_BASE_PATH}/homepage/config:/app/config
      - ${SERVER_BASE_PATH}/homepage/images:/app/public/images
    environment:
      HOMEPAGE_ALLOWED_HOSTS: homepage.${SERVER_NAME}
    depends_on:
      - dockerproxy
    networks:
      - voidroute
      - homepage-mgmt

  # Read-only Docker API for Homepage container status; only reachable from homepage-mgmt
  dockerproxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: dockerproxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homepage-mgmt

  # Full Docker access by design (it is a Docker management UI); reachable only via Caddy
  vaultwarden:
    image: vaultwarden/server:1.37.4
    container_name: vaultwarden
    restart: unless-stopped
    env_file:
      - ${SERVER_BASE_PATH}/vaultwarden/vaultwarden.env
    environment:
      - DOMAIN=https://vault.${SERVER_NAME}
      - SIGNUPS_ALLOWED=true  # TEMPORARY: set back to false after creating the first account
    volumes:
      - ${SERVER_BASE_PATH}/vaultwarden/data:/data
    networks:
      - voidroute

  gym-api:
    image: ghcr.io/duartesantos8/opengym-api:1.4.3
    container_name: gym-api
    restart: unless-stopped
    environment:
      - RP_ID=gym.${SERVER_NAME}
      - ORIGIN=https://gym.${SERVER_NAME}
      - FIRST_USER_ADMIN=1
      - INVITE_ONLY=1
      - TRUST_PROXY=1
      - DATA_DIR=/data
    volumes:
      - ${SERVER_BASE_PATH}/opengym/data:/data
    networks:
      - voidroute

  gym-web:
    image: ghcr.io/duartesantos8/opengym-web:1.4.3
    container_name: gym-web
    restart: unless-stopped
    depends_on:
      - gym-api
    environment:
      - BACKEND=gym-api
      - PORT=3000
    networks:
      - voidroute

  vikunja:
    image: vikunja/vikunja:2.7.1
    container_name: vikunja
    restart: unless-stopped
    env_file:
      - ${SERVER_BASE_PATH}/vikunja/vikunja.env
    environment:
      - VIKUNJA_SERVICE_PUBLICURL=https://planner.${SERVER_NAME}
      # TEMPORARY: true only to create the first account, then set back to false
      - VIKUNJA_SERVICE_ENABLEREGISTRATION=true
      - VIKUNJA_DATABASE_TYPE=sqlite
    volumes:
      - ${SERVER_BASE_PATH}/vikunja/db:/db
      - ${SERVER_BASE_PATH}/vikunja/files:/app/vikunja/files
    networks:
      - voidroute

  portainer:
    image: portainer/portainer-ce:lts
    container_name: portainer
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SERVER_BASE_PATH}/portainer/data:/data
    networks:
      - voidroute

  jellyfin:
    image: lscr.io/linuxserver/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    # Intel QuickSync (HD 630). The linuxserver image detects the GID owning
    # /dev/dri/renderD128 at startup and adds its user to it, so no group_add needed.
    devices:
      - /dev/dri:/dev/dri
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/config/jellyfin:/config
      - ${MEDIA_ROOT}/data/media/movies:/media/movies
      - ${MEDIA_ROOT}/data/media/series:/media/series
    networks:
      - voidroute

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ${MEDIA_ROOT}/config/qbittorrent:/config
      # Single /data mount shared with sonarr/radarr so imports can hardlink instead of copy
      - ${MEDIA_ROOT}/data:/data
    networks:
      - voidroute

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/config/sonarr:/config
      - ${MEDIA_ROOT}/data:/data
    networks:
      - voidroute

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/config/radarr:/config
      - ${MEDIA_ROOT}/data:/data
    networks:
      - voidroute

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/config/prowlarr:/config
    networks:
      - voidroute

  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/config/bazarr:/config
      - ${MEDIA_ROOT}/data/media:/data/media
    networks:
      - voidroute

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - TZ=${TZ}
    networks:
      - voidroute

  jellyseerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: jellyseerr
    restart: unless-stopped
    init: true
    environment:
      - TZ=${TZ}
    volumes:
      - ${MEDIA_ROOT}/config/jellyseerr:/app/config
    networks:
      - voidroute

networks:
  voidroute:
    external: true
    name: ${DOCKER_NETWORK}
  homepage-mgmt:
    internal: true
    ipam:
      config:
        - subnet: 172.30.254.0/28
          # Dynamic IPs come only from .8-.15 so caddy's static .2 is never handed out first
          ip_range: 172.30.254.8/29
