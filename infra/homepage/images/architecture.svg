<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="960" height="650" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">voidroute stack</text>

  <!-- outside -->
  <rect x="40" y="70" width="160" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Your device</text>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#475569">home LAN or remote</text>

  <rect x="260" y="70" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="360" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">AdGuard Home</text>
  <text x="360" y="116" text-anchor="middle" font-size="12" fill="#475569">LAN DNS (split-brain)</text>

  <rect x="500" y="70" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="600" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">VPN</text>
  <text x="600" y="116" text-anchor="middle" font-size="12" fill="#475569">remote access only</text>

  <!-- device: DNS query to AdGuard -->
  <line x1="200" y1="100" x2="260" y2="100" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- AdGuard rewrites *.domain to the server -->
  <line x1="400" y1="130" x2="400" y2="195" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="166" font-size="11" fill="#475569">rewrites *.domain to server</text>
  <!-- remote traffic enters through VPN -->
  <line x1="600" y1="130" x2="600" y2="170" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- voidroute network -->
  <rect x="40" y="160" width="880" height="280" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="60" y="184" font-size="13" font-weight="600" fill="#1e40af">voidroute network: public services via Caddy</text>

  <rect x="380" y="195" width="200" height="51" rx="8" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
  <text x="480" y="217" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Caddy</text>
  <text x="480" y="236" text-anchor="middle" font-size="11" fill="#dbeafe">TLS, routing, access control</text>

  <!-- bus from Caddy to row A -->
  <line x1="480" y1="246" x2="480" y2="265" stroke="#334155" stroke-width="1.5"/>
  <line x1="122" y1="265" x2="822" y2="265" stroke="#334155" stroke-width="1.5"/>
  <line x1="122" y1="265" x2="122" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="262" y1="265" x2="262" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="402" y1="265" x2="402" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="542" y1="265" x2="542" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="682" y1="265" x2="682" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="822" y1="265" x2="822" y2="280" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- row A: media (public) -->
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="280" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="122" y="310" fill="#0f172a">Jellyfin</text>
    <rect x="200" y="280" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="262" y="310" fill="#0f172a">Jellyseerr</text>
    <rect x="340" y="280" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="402" y="310" fill="#0f172a">Sonarr</text>
    <rect x="480" y="280" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="542" y="310" fill="#0f172a">Radarr</text>
    <rect x="620" y="280" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="682" y="310" fill="#0f172a">qBittorrent</text>
    <rect x="760" y="280" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="822" y="310" fill="#0f172a">Prowlarr</text>
  </g>

  <!-- row B: other services -->
  <g font-size="14" text-anchor="middle">
    <rect x="60" y="350" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="122" y="380" fill="#0f172a">Bazarr</text>
    <rect x="200" y="350" width="124" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="262" y="380" fill="#0f172a">Flaresolverr</text>
    <rect x="340" y="350" width="124" height="50" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="402" y="380" fill="#0f172a">Portainer</text>
    <rect x="480" y="350" width="124" height="50" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="542" y="380" fill="#0f172a">PostgreSQL</text>
  </g>
  <text x="620" y="372" font-size="12" fill="#475569">Flaresolverr and PostgreSQL</text>
  <text x="620" y="388" font-size="12" fill="#475569">are internal only</text>

  <!-- homepage-mgmt network -->
  <rect x="40" y="470" width="880" height="130" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="494" font-size="13" font-weight="600" fill="#166534">homepage-mgmt network: internal only</text>

  <rect x="100" y="510" width="260" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="230" y="535" text-anchor="middle" font-size="14" fill="#0f172a">Caddy admin API</text>
  <text x="230" y="555" text-anchor="middle" font-size="12" fill="#475569">used by the Homepage widget</text>

  <rect x="380" y="510" width="200" height="60" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="480" y="535" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Homepage</text>
  <text x="480" y="555" text-anchor="middle" font-size="12" fill="#475569">dashboard</text>

  <rect x="620" y="510" width="240" height="60" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="740" y="535" text-anchor="middle" font-size="14" fill="#0f172a">dockerproxy</text>
  <text x="740" y="555" text-anchor="middle" font-size="12" fill="#475569">read-only Docker API</text>

  <line x1="380" y1="540" x2="360" y2="540" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="580" y1="540" x2="620" y2="540" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- legend -->
  <g font-size="12" fill="#475569">
    <rect x="40" y="620" width="28" height="14" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="76" y="632">public via Caddy</text>
    <rect x="220" y="620" width="28" height="14" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="256" y="632">internal only</text>
    <line x1="400" y1="627" x2="428" y2="627" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="436" y="632">request flow</text>
  </g>
</svg>
