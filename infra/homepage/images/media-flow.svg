<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="580" fill="#ffffff"/>
  <text x="480" y="36" text-anchor="middle" font-size="22" font-weight="600" fill="#0f172a">How a movie or episode gets to Jellyfin</text>

  <!-- 1. Seerr -->
  <rect x="60" y="80" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">1 Seerr</text>
  <text x="160" y="126" text-anchor="middle" font-size="12" fill="#475569">you request a title</text>

  <!-- 2. Radarr / Sonarr -->
  <rect x="380" y="80" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">2 Radarr / Sonarr</text>
  <text x="480" y="126" text-anchor="middle" font-size="12" fill="#475569">finds and picks a release</text>

  <!-- 3. Prowlarr -->
  <rect x="700" y="80" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="800" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">3 Prowlarr</text>
  <text x="800" y="126" text-anchor="middle" font-size="12" fill="#475569">searches the indexers</text>

  <!-- 4. qBittorrent -->
  <rect x="380" y="230" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">4 qBittorrent</text>
  <text x="480" y="276" text-anchor="middle" font-size="12" fill="#475569">downloads the torrent</text>

  <!-- 5. Downloads folder -->
  <rect x="60" y="230" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="256" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Downloads</text>
  <text x="160" y="276" text-anchor="middle" font-size="12" fill="#475569">/data/downloads</text>

  <!-- 6. Media library -->
  <rect x="60" y="370" width="200" height="60" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="160" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Media library</text>
  <text x="160" y="416" text-anchor="middle" font-size="12" fill="#475569">/data/media</text>

  <!-- 7. Jellyfin -->
  <rect x="380" y="370" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="480" y="396" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">7 Jellyfin</text>
  <text x="480" y="416" text-anchor="middle" font-size="12" fill="#475569">you watch on TV</text>

  <!-- 8. Bazarr -->
  <rect x="60" y="490" width="200" height="60" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="516" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">8 Bazarr</text>
  <text x="160" y="536" text-anchor="middle" font-size="12" fill="#475569">adds subtitles</text>

  <!-- arrows -->
  <line x1="260" y1="110" x2="380" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="100" text-anchor="middle" font-size="11" fill="#475569">request</text>

  <line x1="580" y1="110" x2="700" y2="110" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="640" y="100" text-anchor="middle" font-size="11" fill="#475569">search</text>

  <line x1="480" y1="140" x2="480" y2="230" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="490" y="190" font-size="11" fill="#475569">send torrent</text>

  <line x1="380" y1="260" x2="260" y2="260" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="252" text-anchor="middle" font-size="11" fill="#475569">finished files</text>

  <line x1="160" y1="290" x2="160" y2="370" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="335" font-size="11" fill="#475569">import (hardlink)</text>

  <line x1="260" y1="400" x2="380" y2="400" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="392" text-anchor="middle" font-size="11" fill="#475569">Jellyfin scans</text>

  <line x1="160" y1="490" x2="160" y2="430" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="170" y="466" font-size="11" fill="#475569">subtitles saved next to file</text>

  <!-- notes -->
  <g font-size="12" fill="#475569">
    <text x="620" y="300" font-weight="600" fill="#0f172a">Notes</text>
    <text x="620" y="322">Steps 1-3 and 4 run as the arrows show.</text>
    <text x="620" y="340">Downloads and media share one /data mount,</text>
    <text x="620" y="358">so import is an instant hardlink, not a copy.</text>
    <text x="620" y="390">Seeding continues in qBittorrent until the</text>
    <text x="620" y="408">rule for the tracker is met (72 h or ratio 1.0).</text>
  </g>
</svg>
