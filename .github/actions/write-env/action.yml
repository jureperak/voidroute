name: Write .env
description: Writes the non-secret stack variables (read from the job environment) to a .env file on the server

runs:
  using: composite
  steps:
    - name: Write .env file
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$SERVER_BASE_PATH"
        umask 077
        for var in SERVER_NAME SERVER_BASE_PATH DOCKER_NETWORK VOIDROUTE_VPN_SUBNET MEDIA_ROOT TZ PUID PGID; do
          if [ -z "${!var:-}" ]; then
            echo "::error::$var is not set" && exit 1
          fi
          printf '%s=%s\n' "$var" "${!var}"
        done > "$ENV_FILE"
        chmod 600 "$ENV_FILE"
