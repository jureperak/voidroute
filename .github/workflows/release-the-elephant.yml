name: Manual Deploy Postgres

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: Production

    steps:
      - name: Ensure postgres volume exists
        run: docker volume inspect pg_data >/dev/null 2>&1 || docker volume create pg_data

      - name: Ensure docker network exists
        env:
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
        run: |
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || \
          docker network create "$DOCKER_NETWORK"

      - name: Pull Postgres image
        run: docker pull postgres:16

      - name: Stop/remove old postgres container
        run: docker rm -f postgres 2>/dev/null || true

      - name: Run Postgres
        env:
          DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
        run: |
          docker run -d \
            --name postgres \
            --restart unless-stopped \
            --network "$DOCKER_NETWORK" \
            -p 127.0.0.1:5432:5432 \
            -e POSTGRES_PASSWORD \
            -v "pg_data:/var/lib/postgresql/data" \
            postgres:16

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            docker exec postgres pg_isready -U postgres && exit 0
            sleep 2
          done
          echo "Postgres not ready" && exit 1

      - name: Create app database role
        env:
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$APP_DB_PASSWORD" ] || { echo "::error::secret APP_DB_PASSWORD is not set"; exit 1; }
          # CREATEDB lets the app's EF Core Migrate() create its database on first start.
          # The password is re-applied on every run, so it stays in sync with the secret.
          docker exec -i -e APP_DB_PASSWORD postgres sh -c 'psql -v ON_ERROR_STOP=1 -U postgres -v pw="$APP_DB_PASSWORD"' <<'SQL'
          SELECT 'CREATE ROLE myapp LOGIN'
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'myapp')
          \gexec
          SELECT format('ALTER ROLE myapp LOGIN PASSWORD %L CREATEDB', :'pw')
          \gexec
          SQL
