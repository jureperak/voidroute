name: Deploy

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
    paths:
      - infra/**

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SERVER_NAME: ${{ vars.SERVER_NAME }}
  SERVER_BASE_PATH: ${{ vars.SERVER_BASE_PATH }}
  DOCKER_NETWORK: ${{ vars.DOCKER_NETWORK }}
  VOIDROUTE_VPN_SUBNET: ${{ vars.VOIDROUTE_VPN_SUBNET }}
  MEDIA_ROOT: ${{ vars.MEDIA_ROOT }}
  TZ: ${{ vars.TZ }}
  PUID: ${{ vars.PUID }}
  PGID: ${{ vars.PGID }}
  ENV_FILE: ${{ vars.SERVER_BASE_PATH }}/.env

jobs:
  deploy:
    # Only merged PRs into main, or a manual run from main; closed-unmerged PRs never reach the runner
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: self-hosted
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Write .env
        uses: ./.github/actions/write-env

      - name: Write Caddy secrets
        env:
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_API_SECRET_KEY: ${{ secrets.PORKBUN_API_SECRET_KEY }}
        run: |
          set -euo pipefail
          for var in PORKBUN_API_KEY PORKBUN_API_SECRET_KEY; do
            [ -n "${!var:-}" ] || { echo "::error::secret $var is not set"; exit 1; }
          done
          mkdir -p "$SERVER_BASE_PATH/caddy"
          umask 077
          printf 'PORKBUN_API_KEY=%s\nPORKBUN_API_SECRET_KEY=%s\n' "$PORKBUN_API_KEY" "$PORKBUN_API_SECRET_KEY" > "$SERVER_BASE_PATH/caddy/caddy.env"
          chmod 600 "$SERVER_BASE_PATH/caddy/caddy.env"

      - name: Ensure docker network exists
        run: |
          docker network inspect "$DOCKER_NETWORK" >/dev/null 2>&1 || \
          docker network create "$DOCKER_NETWORK"

      - name: Generate Homepage config
        env:
          JELLYFIN_API_KEY: ${{ secrets.JELLYFIN_API_KEY }}
          QBITTORRENT_USERNAME: ${{ secrets.QBITTORRENT_USERNAME }}
          QBITTORRENT_PASSWORD: ${{ secrets.QBITTORRENT_PASSWORD }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
          JELLYSEERR_API_KEY: ${{ secrets.JELLYSEERR_API_KEY }}
        run: |
          mkdir -p "$SERVER_BASE_PATH/homepage/config"

          cp infra/homepage/config/settings.yaml "$SERVER_BASE_PATH/homepage/config/"
          cp infra/homepage/config/docker.yaml "$SERVER_BASE_PATH/homepage/config/"
          cp infra/homepage/config/widgets.yaml "$SERVER_BASE_PATH/homepage/config/"

          mkdir -p "$SERVER_BASE_PATH/homepage/images"
          cp infra/homepage/images/architecture.svg infra/homepage/images/media-flow.svg "$SERVER_BASE_PATH/homepage/images/"

          envsubst < infra/homepage/config/services.yaml.template > "$SERVER_BASE_PATH/homepage/config/services.yaml"
          envsubst < infra/homepage/config/bookmarks.yaml.template > "$SERVER_BASE_PATH/homepage/config/bookmarks.yaml"

      - name: Seed arr API keys
        env:
          MEDIA_ROOT: ${{ vars.MEDIA_ROOT }}
          SONARR_API_KEY: ${{ secrets.SONARR_API_KEY }}
          RADARR_API_KEY: ${{ secrets.RADARR_API_KEY }}
          PROWLARR_API_KEY: ${{ secrets.PROWLARR_API_KEY }}
          BAZARR_API_KEY: ${{ secrets.BAZARR_API_KEY }}
        run: |
          set -euo pipefail
          seed_key() {
            local app="$1" key="$2" dir file
            dir="$MEDIA_ROOT/config/$app"
            file="$dir/config.xml"
            [ -n "$key" ] || { echo "::error::secret for $app is not set"; exit 1; }
            mkdir -p "$dir"
            if [ ! -f "$file" ]; then
              printf '<Config>\n  <ApiKey>%s</ApiKey>\n</Config>\n' "$key" > "$file"
            elif grep -q '<ApiKey>' "$file"; then
              grep -q "<ApiKey>$key</ApiKey>" "$file" && { echo "$app: API key unchanged"; return 0; }
              sed -i "s|<ApiKey>[^<]*</ApiKey>|<ApiKey>$key</ApiKey>|" "$file"
            else
              echo "::error::$file has no ApiKey element"; exit 1
            fi
            echo "$app: API key updated"
            if docker ps -a --format '{{.Names}}' | grep -qx "$app"; then docker restart "$app" >/dev/null; fi
          }
          seed_key sonarr "$SONARR_API_KEY"
          seed_key radarr "$RADARR_API_KEY"
          seed_key prowlarr "$PROWLARR_API_KEY"
          seed_bazarr_key() {
            local key="$1" file="$MEDIA_ROOT/config/bazarr/config/config.yaml" current
            [ -n "$key" ] || { echo "::error::secret for bazarr is not set"; exit 1; }
            if [ ! -f "$file" ]; then
              echo "::warning::bazarr config not found yet; start Bazarr once, then re-run"; return 0
            fi
            current=$(awk '/^auth:/{f=1;next} /^[a-z]/{f=0} f && /^  apikey:/{print $2; exit}' "$file")
            [ "$current" = "$key" ] && { echo "bazarr: API key unchanged"; return 0; }
            sed -i "/^auth:/,/^[a-z]/ s|^  apikey: .*|  apikey: $key|" "$file"
            echo "bazarr: API key updated"
            if docker ps -a --format '{{.Names}}' | grep -qx bazarr; then docker restart bazarr >/dev/null; fi
          }
          seed_bazarr_key "$BAZARR_API_KEY"

      - name: Deploy stack
        run: |
          cd infra
          docker compose --env-file "$ENV_FILE" pull --ignore-buildable
          docker compose --env-file "$ENV_FILE" build --pull caddy
          docker compose --env-file "$ENV_FILE" up -d --force-recreate --remove-orphans

          docker image prune -f

      - name: Status
        run: docker compose -f infra/docker-compose.yml --env-file "$ENV_FILE" ps
